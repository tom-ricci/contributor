name: Update Contributions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Contributor
        uses: actions/checkout@v4
        with:
          path: "./contributor"
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Execute Contributor
        env:
          # All repository secrets, so entries in manifest.json can reference
          # their token by name. Adding a token never requires editing this workflow.
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Run Contributor. Source clones authenticate with each entry's own
          # token; contribution graphs are fetched over the GraphQL API. It
          # operates on ./contributor and clones sources beside it.
          bun ./contributor/src/index.ts
          # Push the newly created commits using the checkout-provided credentials.
          cd ./contributor
          git push
