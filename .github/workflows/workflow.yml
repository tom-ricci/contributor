name: Update Contributions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Contributor
        uses: actions/checkout@v4
        with:
          path: "./contributor"
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Execute Contributor
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # Configure GitHub CLI token auth for Git HTTPS operations (clones).
          export GH_TOKEN="${ACCESS_TOKEN}"
          gh auth setup-git
          # Run Contributor. Cloning, deduplication, and commit creation all
          # happen here; it operates on ./contributor and clones sources beside it.
          bun ./contributor/src/index.ts
          # Clear GH_TOKEN before push so checkout-provided credentials remain authoritative.
          unset GH_TOKEN
          # Push the newly created commits to the repository remote.
          cd ./contributor
          git push
